<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">FG knot tying sequence</title><desc id="desc">Four clear stages: tension both lines, weave alternating braid wraps, lock the wraps, and trim and test.</desc><rect width="1080" height="520" rx="28" fill="#f4f0e7"/><text x="42" y="56" fill="#0e3543" font-family="Arial,sans-serif" font-size="27" font-weight="700">FG-ВУЗОЛ · 4 ЕТАПИ</text><text x="42" y="88" fill="#647b83" font-family="Arial,sans-serif" font-size="16">Схематично показано розташування шнурів, не масштаб</text><g font-family="Arial,sans-serif"><rect x="35" y="115" width="490" height="170" rx="20" fill="#fffdf9" stroke="#d8ded9" stroke-width="2"/><circle cx="70" cy="151" r="21" fill="#f2a33b"/><text x="64" y="158" fill="#0e3543" font-size="19" font-weight="700">1</text><text x="105" y="158" fill="#0e3543" font-size="17" font-weight="700">НАТЯГНИ ОБИДВІ ЛІНІЇ</text><path d="M80 220h390" stroke="#f2a33b" stroke-width="10" stroke-linecap="round"/><path d="M80 244h390" stroke="#11637b" stroke-width="6" stroke-linecap="round"/><text x="87" y="271" fill="#647b83" font-size="14">Лідер прямо · плетінка під натягом</text><rect x="555" y="115" width="490" height="170" rx="20" fill="#fffdf9" stroke="#d8ded9" stroke-width="2"/><circle cx="590" cy="151" r="21" fill="#f2a33b"/><text x="584" y="158" fill="#0e3543" font-size="19" font-weight="700">2</text><text x="625" y="158" fill="#0e3543" font-size="17" font-weight="700">ЧЕРГУЙ ВИТОКИ</text><path d="M610 220h385" stroke="#f2a33b" stroke-width="10" stroke-linecap="round"/><path d="M635 190c18 0 18 58 36 58s18-58 36-58 18 58 36 58 18-58 36-58 18 58 36 58 18-58 36-58 18 58 36 58 18-58 36-58 18 58 36 58" fill="none" stroke="#11637b" stroke-width="6" stroke-linecap="round"/><text x="607" y="271" fill="#647b83" font-size="14">По одному з кожного боку лідера</text><rect x="35" y="310" width="490" height="170" rx="20" fill="#fffdf9" stroke="#d8ded9" stroke-width="2"/><circle cx="70" cy="346" r="21" fill="#f2a33b"/><text x="64" y="353" fill="#0e3543" font-size="19" font-weight="700">3</text><text x="105" y="353" fill="#0e3543" font-size="17" font-weight="700">ЗАФІКСУЙ ПІВВУЗЛАМИ</text><path d="M83 411h178m35 0h182" stroke="#f2a33b" stroke-width="10" stroke-linecap="round"/><path d="M260 411c0-27 28-27 28 0s28 27 28 0-28-27-28 0" fill="none" stroke="#11637b" stroke-width="6"/><text x="87" y="452" fill="#647b83" font-size="14">Поступово підтягни переплетення</text><rect x="555" y="310" width="490" height="170" rx="20" fill="#0e3543"/><circle cx="590" cy="346" r="21" fill="#f2a33b"/><text x="584" y="353" fill="#0e3543" font-size="19" font-weight="700">4</text><text x="625" y="353" fill="#fffdf9" font-size="17" font-weight="700">ОБРІЖ І ПЕРЕВІР</text><path d="M632 411h310" stroke="#f2a33b" stroke-width="10" stroke-linecap="round"/><path d="m930 390 26 21-26 21" fill="none" stroke="#52b8bd" stroke-width="7"/><text x="607" y="452" fill="#d8e8e6" font-size="14">Потягни вузол · перевір прохідність</text></g></svg>
