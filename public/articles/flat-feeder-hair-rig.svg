<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Flat feeder hair rig tying sequence</title><desc id="desc">Four stages: tie the hair loop, add bait and stop, wind the hooklength around the shank, and pass the line through the eye toward the hook point.</desc><rect width="1080" height="520" rx="28" fill="#f4f0e7"/><text x="42" y="56" fill="#0e3543" font-family="Arial,sans-serif" font-size="27" font-weight="700">ВОЛОС ДЛЯ ФЛЕТ-ФІДЕРА · 4 ЕТАПИ</text><text x="42" y="88" fill="#647b83" font-family="Arial,sans-serif" font-size="16">Насадка окремо від гачка · жало залишається відкритим</text><g font-family="Arial,sans-serif"><rect x="35" y="115" width="490" height="170" rx="20" fill="#fffdf9" stroke="#d8ded9" stroke-width="2"/><circle cx="70" cy="151" r="21" fill="#f2a33b"/><text x="64" y="158" fill="#0e3543" font-size="19" font-weight="700">1</text><text x="105" y="158" fill="#0e3543" font-size="17" font-weight="700">ЗАВ’ЯЖИ ПЕТЛЮ</text><path d="M130 224h180c0 48-68 48-68 0" fill="none" stroke="#11637b" stroke-width="8" stroke-linecap="round"/><text x="87" y="271" fill="#647b83" font-size="14">Маленька петля стане волосом</text><rect x="555" y="115" width="490" height="170" rx="20" fill="#fffdf9" stroke="#d8ded9" stroke-width="2"/><circle cx="590" cy="151" r="21" fill="#f2a33b"/><text x="584" y="158" fill="#0e3543" font-size="19" font-weight="700">2</text><text x="625" y="158" fill="#0e3543" font-size="17" font-weight="700">НАДІНЬ НАСАДКУ</text><path d="M650 222h135" stroke="#11637b" stroke-width="7"/><circle cx="840" cy="222" r="32" fill="#f2a33b"/><path d="M797 222h10m64 0h10" stroke="#0e3543" stroke-width="6"/><text x="607" y="271" fill="#647b83" font-size="14">Закріпи її стопором</text><rect x="35" y="310" width="490" height="170" rx="20" fill="#fffdf9" stroke="#d8ded9" stroke-width="2"/><circle cx="70" cy="346" r="21" fill="#f2a33b"/><text x="64" y="353" fill="#0e3543" font-size="19" font-weight="700">3</text><text x="105" y="353" fill="#0e3543" font-size="17" font-weight="700">ЗРОБИ 6–8 ВИТКІВ</text><path d="M109 418h300c47 0 63 28 63 48 0 18-17 31-37 31" fill="none" stroke="#0e3543" stroke-width="8" stroke-linecap="round"/><path d="M220 418c8-21 16 21 24 0s16 21 24 0 16 21 24 0 16 21 24 0 16 21 24 0" fill="none" stroke="#11637b" stroke-width="6"/><text x="87" y="452" fill="#647b83" font-size="14">Від вигину гачка до вушка</text><rect x="555" y="310" width="490" height="170" rx="20" fill="#0e3543"/><circle cx="590" cy="346" r="21" fill="#f2a33b"/><text x="584" y="353" fill="#0e3543" font-size="19" font-weight="700">4</text><text x="625" y="353" fill="#fffdf9" font-size="17" font-weight="700">ВИВЕДИ КІНЕЦЬ КРІЗЬ ВУШКО</text><path d="M658 416h196c55 0 68 31 68 52 0 18-18 29-41 29" fill="none" stroke="#fffdf9" stroke-width="8" stroke-linecap="round"/><circle cx="850" cy="416" r="9" fill="#f2a33b"/><path d="M842 416h-38" stroke="#52b8bd" stroke-width="6"/><text x="607" y="452" fill="#d8e8e6" font-size="14">Кінець виходить у бік жала</text></g></svg>
