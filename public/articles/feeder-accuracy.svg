<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc"><title id="title">Accurate feeder casting in three steps</title><desc id="desc">Pick a distant marker, clip the line after checking distance, and brake smoothly as the feeder lands.</desc><rect width="1080" height="360" rx="28" fill="#f4f0e7"/><text x="42" y="55" fill="#0e3543" font-family="Arial,sans-serif" font-size="26" font-weight="700">ТОЧНИЙ ЗАКИД · ОДНА ТОЧКА КОЖНОГО РАЗУ</text><g font-family="Arial,sans-serif"><rect x="35" y="84" width="320" height="236" rx="22" fill="#fffdf9" stroke="#d8ded9" stroke-width="2"/><circle cx="73" cy="124" r="23" fill="#f2a33b"/><text x="66" y="132" fill="#0e3543" font-size="22" font-weight="700">1</text><text x="110" y="131" fill="#0e3543" font-size="18" font-weight="700">ОРІЄНТИР</text><path d="M63 243h260M83 241l63-76 58 76m-46-53 90 33" fill="none" stroke="#11637b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="243" cy="189" r="10" fill="#f2a33b"/><text x="61" y="295" fill="#647b83" font-size="15">Закидай в одному напрямку</text><rect x="380" y="84" width="320" height="236" rx="22" fill="#fffdf9" stroke="#d8ded9" stroke-width="2"/><circle cx="418" cy="124" r="23" fill="#f2a33b"/><text x="411" y="132" fill="#0e3543" font-size="22" font-weight="700">2</text><text x="455" y="131" fill="#0e3543" font-size="18" font-weight="700">ДИСТАНЦІЯ</text><circle cx="520" cy="217" r="49" fill="#e3f0ec" stroke="#11637b" stroke-width="6"/><circle cx="520" cy="217" r="18" fill="none" stroke="#11637b" stroke-width="5"/><path d="M569 217h65m-12-12 12 12-12 12" fill="none" stroke="#f2a33b" stroke-width="7"/><text x="409" y="295" fill="#647b83" font-size="15">Кліпсуй волосінь після проміру</text><rect x="725" y="84" width="320" height="236" rx="22" fill="#fffdf9" stroke="#d8ded9" stroke-width="2"/><circle cx="763" cy="124" r="23" fill="#f2a33b"/><text x="756" y="132" fill="#0e3543" font-size="22" font-weight="700">3<