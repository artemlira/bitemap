<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Feeder paternoster assembly in four steps</title><desc id="desc">Follow the main line, create a feeder side branch, attach a separate hooklength, and check that the feeder can release safely.</desc><rect width="1080" height="520" rx="28" fill="#f4f0e7"/><text x="42" y="56" fill="#0e3543" font-family="Arial,sans-serif" font-size="27" font-weight="700">ФІДЕРНИЙ ПАТЕРНОСТЕР · ЗБЕРИ МОНТАЖ ПО ЧАСТИНАХ</text><text x="42" y="88" fill="#647b83" font-family="Arial,sans-serif" font-size="16">Відведення годівниці та повідець — різні гілки</text><g font-family="Arial,sans-serif"><rect x="35" y="115" width="490" height="170" rx="20" fill="#fffdf9" stroke="#d8ded9" stroke-width="2"/><circle cx="70" cy="151" r="21" fill="#f2a33b"/><text x="64" y="158" fill="#0e3543" font-size="19" font-weight="700">1</text><text x="105" y="158" fill="#0e3543" font-size="17" font-weight="700">ОСНОВНА ЛІНІЯ</text><path d="M101 225h350" stroke="#11637b" stroke-width="9" stroke-linecap="round"/><circle cx="280" cy="225" r="11" fill="#f2a33b"/><text x="87" y="271" fill="#647b83" font-size="14">Відміряй і зав’яжи вузол-відвід</text><rect x="555" y="115" width="490" height="170" rx="20" fill="#fffdf9" stroke="#d8ded9" stroke-width="2"/><circle cx="590" cy="151" r="21" fill="#f2a33b"/><text x="584" y="158" fill="#0e3543" font-size="19" font-weight="700">2</text><text x="625" y="158" fill="#0e3543" font-size="17" font-weight="700">ВІДВІД ДЛЯ ГОДІВНИЦІ</text><path d="M611 220h190m0 0v35" stroke="#11637b" stroke-width="8" stroke-linecap="round"/><path d="M801 255v18" stroke="#f2a33b" stroke-width="5" stroke-dasharray="4 4"/><path d="M780 273h42l-6 22h-30z" fill="#f2a33b"/><text x="607" y="244" fill="#647b83" font-size="14">Карабін / вертлюжок</text><rect x="35" y="310" width="490" height="170" rx="20" fill="#fffdf9" stroke="#d8ded9" stroke-width="2"/><circle cx="70" cy="346" r="21" fill="#f2a33b"/><text x="64" y="353" fill="#0e3543" font-size="19" font-weight="700">3</text><text x="105" y="353" fill="#0e3543" font-size="17" font-weight="700">ОКРЕМИЙ ПОВІДЕЦЬ</text><path d="M111 402h140m0 0h98" stroke="#11637b" stroke-width="7" stroke-linecap="round"/><circle cx="251" cy="402" r="9" fill="#f2a33b"/><path d="M349 402c44 0 54 24 54 41 0 17-14 28-31 28" fill="none" stroke="#0e3543" stroke-width="7"/><text x="87" y="452" fill="#647b83" font-size="14">Петля в петлю · довжина за умовами</text><rect x="555" y="310" width="490" height="170" rx="20" fill="#0e3543"/><circle cx="590" cy="346" r="21" fill="#f2a33b"/><text x="584" y="353" fill="#0e3543" font-size="19" font-weight="700">4</text><text x="625" y="353" fill="#fffdf9" font-size="17" font-weight="700">ПЕРЕВІР БЕЗПЕКУ</text><path d="M638 411h160v29h60" fill="none" stroke="#52b8bd" stroke-width="8" stroke-linecap="round"/><path d="M801 411v28" stroke="#f2a33b" stroke-width="5" stroke-dasharray="4 4"/><path d="M786 439h31l-5 18h-21z" fill="#f2a33b"/><text x="607" y="474" fill="#d8e8e6" font-size="14">Годівниця має від’єднатися при обриві</text></g></svg>
