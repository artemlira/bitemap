name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-bitemap
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-bitemap.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_APP_ID: demo-app-id

  firebase-tests:
    name: Firestore rules and browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:rules
      - run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
